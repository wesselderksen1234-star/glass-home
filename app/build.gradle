plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.glasshome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.custom.glasshome'
        minSdk 28
        targetSdk 34
        versionCode 204
        versionName '2.0.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
