plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.glasshome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.custom.glasshome'
        minSdk 28
        targetSdk 34
        versionCode 248
        versionName '2.4.8'
    }

    signingConfigs {
        gh {
            storeFile file('glasshome.keystore')
            storePassword 'glasshome'
            keyAlias 'glasshome'
            keyPassword 'glasshome'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.gh
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
