<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Glass Home voorbeeld</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
// Glass Home: speelt een YouTube-voorbeeld af. Draait op een https-adres zodat YouTube het filmpje toestaat.
// Eén speler blijft open en krijgt steeds een nieuw filmpje (cmd "load"), zodat YouTube niet elke keer opnieuw hoeft te laden.
var q={};location.hash.replace(/^#/,"").split("&").forEach(function(x){var a=x.split("=");if(a[0])q[a[0]]=decodeURIComponent(a[1]||"")});
var clean=function(v){return (v||"").replace(/[^\w-]/g,"")};
var boot=0,cur={v:clean(q.v),s:parseInt(q.s||"0",10)||0,vol:Math.min(100,parseInt(q.vol||"60",10)||60),n:q.n||0},pl,ready=0,on=0,ft,to;
function up(m){try{m.n=cur.n;parent.postMessage(Object.assign({gh:"yt"},m),"*")}catch(e){}}
function arm(){clearTimeout(to);on=0;to=setTimeout(function(){if(!on&&cur.v)up({error:"timeout"})},20000)}
function fade(p){clearInterval(ft);try{p.unMute();p.setVolume(0)}catch(x){}var v=0;ft=setInterval(function(){v+=4;try{p.setVolume(Math.min(cur.vol,v))}catch(x){}if(v>=cur.vol)clearInterval(ft)},120)}
function play(){if(!ready||!cur.v)return;arm();try{pl.mute();pl.loadVideoById({videoId:cur.v,startSeconds:cur.s})}catch(x){up({error:"load"})}}
window.onYouTubeIframeAPIReady=function(){
 boot=!!cur.v;var pv={autoplay:cur.v?1:0,mute:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,fs:0,origin:location.origin};if(cur.v)pv.start=cur.s;
 pl=new YT.Player("p",{videoId:cur.v||"M7lc1UVf-VE",playerVars:pv,
  events:{onReady:function(e){ready=1;if(cur.v){if(boot){arm();e.target.mute();e.target.playVideo();}else play();}},
   onStateChange:function(e){if((e.data===1||e.data===3)&&!cur.v&&ready){try{e.target.stopVideo()}catch(x){}return;}if(e.data===1&&!on&&cur.v){on=1;clearTimeout(to);up({state:"playing"});fade(e.target);}
    if(e.data===0&&cur.v){try{e.target.seekTo(cur.s,true);e.target.playVideo()}catch(x){}}},
   onError:function(e){up({error:e.data})}}});};
addEventListener("message",function(e){var d=e.data||{};try{
 if(d.cmd==="load"){cur={v:clean(d.v),s:parseInt(d.s||0,10)||0,vol:Math.min(100,parseInt(d.vol||60,10)||60),n:d.n||0};play();}
 if(d.cmd==="ping"){up({state:"pong",ready:ready,on:on,v:cur.v,api:!!window.YT,ps:pl&&pl.getPlayerState?pl.getPlayerState():-9});return;}
 if(!pl)return;
 if(d.cmd==="stop"){clearInterval(ft);clearTimeout(to);cur.v="";on=0;try{pl.mute();pl.pauseVideo()}catch(x){}pl.stopVideo();}
 if(d.cmd==="mute"){clearInterval(ft);pl.mute();}}catch(x){}});
if(!cur.v&&!q.warm)up({error:"novid"});
var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=function(){up({error:"api"})};document.head.appendChild(s);
if(cur.v)arm();
</script></body></html>
