name: KNMI waarschuwingen
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths: [".github/workflows/knmi.yml", "tools/knmi.py"]
permissions:
  contents: write
jobs:
  knmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/knmi.py out
      - run: |
          cd out
          git init -q -b data
          git config user.name "glasshome-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "KNMI $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
