<!DOCTYPE html><!--GH_BUILD:1.9.4-->
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Glass Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* VOICE premium living-room tv  IDEA a cinema lobby: one huge featured poster, shelves below
   PICTURE full-bleed rotating hero  COLOUR near-black, wallpaper glow, white focus ring
   TYPE Inter 400-800  LAYOUT slim glass rail left, hero, shelves of apps / verder / tips */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s}
.bg.on{opacity:1}
#bgwrap{position:absolute;inset:0;filter:blur(60px) brightness(.45) saturate(1.3);transition:filter 1s}
body.amb #bgwrap{filter:none}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 50%,rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 14px 40px rgba(0,0,0,.35)}
.f{position:relative;will-change:transform;transition:transform .28s cubic-bezier(.2,.9,.25,1),box-shadow .28s}
.f.focus{transform:scale(1.06);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.75),0 26px 60px rgba(0,0,0,.6)}
.f::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .28s;background:linear-gradient(180deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.08) 18%,transparent 40%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95)}
.f.focus::after{opacity:1}
#tint{position:absolute;left:0;top:0;width:240px;height:135px;transform-origin:0 0;transform:scale(8);background-size:cover;background-position:center;filter:blur(5px) saturate(1.5);opacity:0;transition:opacity .9s,background-image .9s;will-change:opacity}
body.tinted #tint{opacity:.42}
#fbg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;filter:brightness(.62) saturate(1.1)}
body.fb #fbg{opacity:1}body.fb #tint{opacity:0}
.pv{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 1.4s ease;pointer-events:none;overflow:hidden;border-radius:inherit;background:#000}
.pv.on{opacity:1}.pv iframe{position:absolute;width:136%;height:136%;left:-18%;top:-18%;border:0}
.card .lab,.card .score,.card .badge{z-index:2}
#hero .pv{z-index:0}
@keyframes kb{from{background-size:auto 112%;background-position:38% 50%}to{background-size:auto 128%;background-position:62% 42%}}
.card.kb,.hi.kb{animation:kb 22s ease-in-out infinite alternate}
#toast{position:absolute;left:50%;bottom:60px;z-index:40;transform:translateX(-50%) translateY(20px);padding:16px 30px;border-radius:30px;font-size:22px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#aextra{margin-top:18px;font-size:26px;opacity:.85;display:flex;flex-direction:column;gap:6px}
.card .live{position:absolute;top:16px;left:16px;height:30px;border-radius:15px;padding:0 12px;background:#ff3b30;font-size:15px;font-weight:800;display:flex;align-items:center}
#ui{position:absolute;inset:0;transition:opacity .6s}
body.lite .glass,body.lite .app,body.lite #clock,body.lite #panel,body.lite #det,body.lite #rail{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.lite .glass,body.lite #rail{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.1) 55%,rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),0 16px 40px rgba(0,0,0,.28)}
body.lite #det{background:linear-gradient(160deg,rgba(44,48,62,.94),rgba(18,20,28,.95))}
body.lite #panel{background:linear-gradient(160deg,rgba(56,60,78,.97),rgba(20,22,32,.98))}
#scrim{position:absolute;inset:0;z-index:29;background:radial-gradient(120% 90% at 50% 50%,rgba(4,5,10,.35),rgba(4,5,10,.7));opacity:0;transition:opacity .35s;pointer-events:none}
#scrim.on{opacity:1}
body.lite #clock{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.1) 55%,rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 16px 40px rgba(0,0,0,.25)}
body.lite .bg.on{animation:none}body.lite #bgwrap{filter:brightness(.62) saturate(1.15)}
body.lite #tint{filter:none;transition:opacity .4s}body.lite .f{will-change:auto;transition:transform .18s ease-out}
body.lite .row.in>*{animation-duration:.25s}
body.amb #ui{opacity:0;pointer-events:none}
/* rail */
#rail{position:absolute;left:36px;top:50%;transform:translateY(-50%);z-index:20;border-radius:44px;padding:16px;display:flex;flex-direction:column;gap:12px;width:104px;transition:width .35s cubic-bezier(.2,.9,.25,1);overflow:hidden}
#rail.open{width:330px}
.ri{height:72px;border-radius:36px;display:flex;align-items:center;gap:22px;padding:0 18px;font-size:24px;font-weight:600;white-space:nowrap;transition:background .25s,color .25s}
.ri span{opacity:0;transition:opacity .2s}#rail.open .ri span{opacity:1}
.ri svg{flex:none;width:36px;height:36px}
.ri.focus{background:#fff;color:#000;transform:none;box-shadow:none}
.ri.focus svg *{stroke:#000}
/* main */
#main{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.9,.25,1)}
#hero{position:absolute;left:0;right:0;top:0;height:640px;overflow:hidden}
.hi{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 1.2s}
.hi.on{opacity:1}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,10,.92) 0,rgba(5,6,10,.55) 40%,rgba(5,6,10,0) 70%)}
#hero{-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
#htxt{position:absolute;left:200px;bottom:110px;z-index:2;width:900px}
#htag{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:600;padding:8px 18px;border-radius:20px;margin-bottom:22px}
#htag i{width:10px;height:10px;border-radius:50%}
#htitle{font-size:84px;font-weight:800;letter-spacing:-2.5px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.4)}
#hmeta{font-size:24px;opacity:.8;margin:18px 0 30px}
#hbtn{display:inline-flex;align-items:center;gap:14px;height:72px;padding:0 36px;border-radius:36px;background:#fff;color:#000;font-size:24px;font-weight:700}
#hbtn svg{width:26px;height:26px}
#dots{position:absolute;right:96px;bottom:118px;z-index:2;display:flex;gap:10px}
#dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.4);transition:all .4s}
#dots i.on{width:34px;background:#fff}
#clock{position:absolute;top:34px;right:96px;z-index:21;display:flex;flex-direction:column;align-items:flex-end;padding:12px 26px 14px;border-radius:26px;background:rgba(10,12,18,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-shadow:0 2px 16px rgba(0,0,0,.4)}
#ctime{font-size:42px;font-weight:600;letter-spacing:-1px;line-height:1.1}#cdate{font-size:19px;font-weight:500;opacity:.8}
.sec{position:absolute;left:0;right:0}
.sec h2{margin-left:200px;font-size:28px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.sec h2 small{font-size:18px;font-weight:500;opacity:.55;margin-left:16px}
.row{display:flex;gap:28px;padding:22px 96px 96px 200px;margin-bottom:-70px;overflow:hidden}
.sec{pointer-events:none}.sec .f{pointer-events:auto}
#s-apps{top:610px}#s-shelf{top:830px;opacity:0;transition:opacity .4s}body.shelf #s-shelf{opacity:1}
#s-cont{top:830px;transition:top .5s cubic-bezier(.2,.9,.25,1),opacity .4s}body.shelf #s-cont{top:1160px}body.det #s-cont{opacity:0}
@keyframes slin{from{opacity:0;transform:translateX(60px)}}.row.in>*{animation:slin .45s cubic-bezier(.2,.9,.25,1) both}
.row.in>*:nth-child(2){animation-delay:.04s}.row.in>*:nth-child(3){animation-delay:.08s}.row.in>*:nth-child(4){animation-delay:.12s}
.empty{flex:none;height:110px;padding:0 34px;border-radius:30px;display:flex;align-items:center;gap:20px;font-size:24px;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.empty svg{width:34px;height:34px;flex:none;opacity:.9}.empty b{margin-left:18px;font-size:19px;font-weight:700;padding:9px 18px;border-radius:20px;background:rgba(255,255,255,.18)}
.empty.focus b{background:#fff;color:#000;text-shadow:none}
#det{position:absolute;left:200px;right:96px;bottom:40px;height:410px;z-index:15;border-radius:38px;padding:40px 48px;display:grid;grid-template-columns:600px 1fr;gap:56px;opacity:0;transform:translateY(40px);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.25,1);pointer-events:none;background:linear-gradient(160deg,rgba(40,44,56,.55),rgba(15,17,24,.6))}
body.det #det{opacity:1;transform:none}
#dtitle{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.05}
#dmeta{font-size:22px;opacity:.7;margin-top:10px}
#dchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{padding:10px 18px;border-radius:22px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);font-size:19px}
.chip b{font-weight:700;margin-left:4px}.chip.big{background:#fff;color:#000;font-weight:800;font-size:24px}.chip.lb{background:rgba(64,188,244,.22);border-color:rgba(64,188,244,.5)}
#det h4{font-size:19px;font-weight:600;opacity:.6;margin-bottom:6px}#det h4+p{margin-bottom:22px}
#det p{font-size:23px;line-height:1.45}#dsrc{font-size:15px;opacity:.5}
.chip.me{background:rgba(255,214,10,.2);border-color:rgba(255,214,10,.5)}
.card .by{font-weight:500;opacity:.8}
#msg{font-size:22px;margin-top:16px;line-height:1.5}#msg .code{font-size:34px;letter-spacing:3px;background:#fff;color:#000;padding:2px 14px;border-radius:10px;margin-left:8px}
#apps{gap:18px}.app{flex:none;width:186px;height:132px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:20px 22px}
.app svg{width:46px;height:46px}
.ico{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.card .gi{position:absolute;right:26px;top:24px;width:96px;height:96px;border-radius:24px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.app b{font-size:21px;font-weight:700;letter-spacing:-.2px}
.app{backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.12),0 14px 34px rgba(0,0,0,.32)}
.app:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%)}
.app>*{position:relative}
.card{flex:none;width:440px;height:248px;border-radius:26px;overflow:hidden;background-size:cover;background-position:center}
.card .lab{position:absolute;left:0;right:0;bottom:0;padding:50px 24px 20px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:25px;font-weight:700}
.card .lab small{display:block;font-size:17px;font-weight:500;opacity:.8;margin-top:3px}
.card .gl{position:absolute;right:26px;top:24px;width:84px;height:84px;opacity:.9}
.card .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:12px}
.card .bar i{display:block;height:100%;border-radius:3px;background:#fff}
.score{position:absolute;top:16px;right:16px;height:34px;border-radius:17px;padding:0 14px;display:flex;align-items:center;font-size:17px;font-weight:800}
.tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#s-yt{top:1490px}
.badge{position:absolute;top:16px;left:16px;height:34px;border-radius:17px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.badge i{width:9px;height:9px;border-radius:50%}
/* ambient */
#amb{position:absolute;left:120px;bottom:110px;opacity:0;transition:opacity .8s;pointer-events:none}
body.amb #amb{opacity:1}
#amb b{display:block;font-size:180px;font-weight:200;letter-spacing:-6px;line-height:1;text-shadow:0 4px 40px rgba(0,0,0,.35)}
#amb span{font-size:38px;opacity:.85}
/* settings */
#panel{position:absolute;top:50%;left:50%;z-index:30;width:1480px;height:800px;padding:48px 52px 36px;border-radius:46px;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.25,1);display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto 1fr auto;column-gap:44px;-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
 background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 50%,rgba(255,255,255,.1));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 40px 120px rgba(0,0,0,.55)}
#panel.single{width:1040px;height:auto;max-height:860px;grid-template-columns:1fr}
#panel h3{grid-column:1/-1}
#pcats{display:flex;flex-direction:column;gap:8px;border-right:1px solid rgba(255,255,255,.14);padding-right:30px}
#panel.single #pcats{display:none}
.cat{display:flex;align-items:center;gap:18px;height:68px;padding:0 22px;border-radius:34px;font-size:25px;font-weight:600;opacity:.75;transition:background .2s,opacity .2s}
.cat svg{width:30px;height:30px;flex:none}
.cat.sel{opacity:1;background:rgba(255,255,255,.14)}
.cat.focus{opacity:1;background:#fff;color:#000}.cat.focus svg *{stroke:#000}
#optwrap{overflow:hidden;min-height:0;display:flex;flex-direction:column}
#opts{position:relative;overflow-y:auto;scroll-behavior:smooth;padding:4px 6px 10px 2px;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#ctitle{font-size:20px;font-weight:600;opacity:.55;margin:2px 0 12px 26px}
#panel.single #ctitle{display:none}
#panel .hint{grid-column:1/-1}
#panel.open{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#panel.opts-dim .opt.focus{background:rgba(255,255,255,.14);color:inherit}
#panel h3{font-size:40px;font-weight:700;margin-bottom:28px;letter-spacing:-.5px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:16px 26px;border-radius:22px;font-size:24px;margin-bottom:6px;cursor:pointer;transition:background .2s}
.opt.focus{background:#fff;color:#000}
.opt .v{opacity:.7}
.opt .mini{width:34px;height:34px;border-radius:8px;vertical-align:middle;margin-right:14px;object-fit:contain}
.vbar{display:inline-block;width:240px;height:8px;border-radius:4px;background:rgba(127,127,127,.35);vertical-align:middle;margin-right:14px;overflow:hidden}.vbar i{display:block;height:100%;background:currentColor;border-radius:4px}
.hint{font-size:19px;opacity:.6;margin-top:18px}
#keybox{display:none;margin-top:14px}#keybox input{width:100%;font:22px Inter,sans-serif;padding:16px 20px;border-radius:18px;border:0}
