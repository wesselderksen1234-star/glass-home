<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><title>Glass Home</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070c url(splash5.png) center/cover no-repeat}::-webkit-scrollbar{display:none;width:0;height:0}</style></head><body>
<script>
// Glass Home lader: start direct met de nieuwste versie die al op de tv staat (ingebouwd of eerder gedownload)
// en haalt op de achtergrond een eventuele nieuwere versie op voor de volgende keer.
(function(){
 var R="https://raw.githubusercontent.com/wesselderksen1234-star/glass-home/main/web/app.html";
 function ver(h){var m=/GH_BUILD:([\d.]+)/.exec(h||"");if(!m)return 0;var p=m[1].split(".");return (+p[0]||0)*1e6+(+p[1]||0)*1e3+(+p[2]||0);}
 var c=null;try{c=localStorage.getItem("ghCode");if(localStorage.getItem("ghBoot")=="1"){localStorage.removeItem("ghCode");localStorage.removeItem("ghBoot");c=null;}}catch(e){}
 function run(h){document.open();document.write(h);document.close();}
 var l=new XMLHttpRequest();l.open("GET","app.html");
 l.onload=function(){var local=l.responseText;if(ver(c)>ver(local)){try{localStorage.setItem("ghBoot","1")}catch(e){}run(c);}else run(local);};
 l.onerror=function(){if(c)run(c);else location.replace("app.html")};l.send();
})();
</script></body></html>
